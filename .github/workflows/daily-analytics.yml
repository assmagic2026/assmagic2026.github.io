name: Daily ASS MAGIC analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  report:
    name: Collect previous JST day
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare and notify by issue
        uses: actions/github-script@v7
        env:
          CF_ACCOUNT_ID: 642e2e69809bb007672c7614596ba234
          CF_SITE_TAG: 8d9ad917bb03464c989c2f618c2f529c
          CF_ENGAGEMENT_DATASET: ass_magic_engagement
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        with:
          script: |
            const token = process.env.CF_ANALYTICS_TOKEN;
            if (!token) {
              core.setFailed("CLOUDFLARE_ANALYTICS_TOKEN is not configured.");
              return;
            }

            const jstNow = new Date(
              new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" })
            );
            jstNow.setDate(jstNow.getDate() - 1);
            const day = [
              jstNow.getFullYear(),
              String(jstNow.getMonth() + 1).padStart(2, "0"),
              String(jstNow.getDate()).padStart(2, "0"),
            ].join("-");
            const start = day + "T00:00:00+09:00";
            const end = day + "T23:59:59+09:00";

            const query = [
              "query DailyWebAnalytics(",
              "  $accountTag: string!,",
              "  $siteTag: string!,",
              "  $start: Time!,",
              "  $end: Time!",
              ") {",
              "  viewer {",
              "    accounts(filter: { accountTag: $accountTag }) {",
              "      total: rumPageloadEventsAdaptiveGroups(",
              "        limit: 1",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } }",
              "      referrers: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { refererHost } }",
              "      paths: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { requestPath } }",
              "      countries: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { countryName } }",
              "      devices: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { deviceType } }",
              "    }",
              "  }",
              "}",
            ].join("\n");

            const response = await fetch("https://api.cloudflare.com/client/v4/graphql", {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
              },
              body: JSON.stringify({
                query,
                variables: {
                  accountTag: process.env.CF_ACCOUNT_ID,
                  siteTag: process.env.CF_SITE_TAG,
                  start,
                  end,
                },
              }),
            });
            const payload = await response.json();
            if (!response.ok || payload.errors?.length) {
              throw new Error(
                "Cloudflare Analytics request failed: " + JSON.stringify(payload.errors || payload)
              );
            }

            const account = payload.data?.viewer?.accounts?.[0];
            if (!account) {
              throw new Error("Cloudflare Analytics returned no account data.");
            }

            const total = account.total?.[0] || {};
            const visits = total.sum?.visits ?? 0;
            const pageviews = total.count ?? 0;
            const formatDuration = (value) => {
              const seconds = Math.max(0, Math.round(Number(value) || 0));
              const hours = Math.floor(seconds / 3600);
              const minutes = Math.floor((seconds % 3600) / 60);
              const remainder = seconds % 60;
              if (hours) return hours + "h " + minutes + "m " + remainder + "s";
              if (minutes) return minutes + "m " + remainder + "s";
              return remainder + "s";
            };

            let engagement = null;
            let engagementNote = "Engaged-time measurement has not received data yet.";
            try {
              const dataset = process.env.CF_ENGAGEMENT_DATASET;
              if (!/^[A-Za-z0-9_]+$/.test(dataset || "")) {
                throw new Error("Invalid Analytics Engine dataset name.");
              }

              const startUtc = new Date(start).toISOString().slice(0, 19).replace("T", " ");
              const endExclusive = new Date(new Date(start).getTime() + 24 * 60 * 60 * 1000);
              const endUtc = endExclusive.toISOString().slice(0, 19).replace("T", " ");
              const engagementQuery = [
                "SELECT",
                "  sum(sample_weight) AS sessions,",
                "  sum(sample_weight * engaged_seconds) AS total_seconds,",
                "  sum(sample_weight * engaged_seconds) / sum(sample_weight) AS average_seconds,",
                "  quantileExactWeighted(0.5)(engaged_seconds, sample_weight) AS median_seconds,",
                "  sumIf(sample_weight, engaged_seconds >= 60) AS sessions_60_seconds",
                "FROM (",
                "  SELECT",
                "    blob1 AS session_id,",
                "    max(double1) AS engaged_seconds,",
                "    max(_sample_interval) AS sample_weight",
                "  FROM " + dataset,
                "  WHERE timestamp >= toDateTime('" + startUtc + "')",
                "    AND timestamp < toDateTime('" + endUtc + "')",
                "  GROUP BY session_id",
                ")",
                "FORMAT JSON",
              ].join("\n");

              const engagementResponse = await fetch(
                "https://api.cloudflare.com/client/v4/accounts/" +
                  process.env.CF_ACCOUNT_ID + "/analytics_engine/sql",
                {
                  method: "POST",
                  headers: {
                    authorization: "Bearer " + token,
                    "content-type": "text/plain;charset=UTF-8",
                  },
                  body: engagementQuery,
                }
              );
              const engagementText = await engagementResponse.text();
              if (!engagementResponse.ok) {
                throw new Error(
                  "Analytics Engine request failed (" + engagementResponse.status + "): " +
                    engagementText.slice(0, 500)
                );
              }

              const engagementPayload = JSON.parse(engagementText);
              const row = engagementPayload.data?.[0];
              const sessions = Number(row?.sessions) || 0;
              const sessions60 = Number(row?.sessions_60_seconds) || 0;
              engagement = {
                sessions,
                totalSeconds: Number(row?.total_seconds) || 0,
                averageSeconds: Number(row?.average_seconds) || 0,
                medianSeconds: Number(row?.median_seconds) || 0,
                sessions60,
                oneMinuteRate: sessions ? (sessions60 / sessions) * 100 : 0,
              };
              engagementNote = sessions
                ? "Visible-tab time; hidden/background time is excluded."
                : "No completed visible-time snapshots were received for this day.";
            } catch (error) {
              core.warning("Engaged-time analytics unavailable: " + String(error));
            }

            const section = (rows, dimension, emptyLabel) => {
              if (!rows?.length) return "- No data";
              return rows
                .map((row) => {
                  const label = row.dimensions?.[dimension] || emptyLabel;
                  return "- " + label + ": **" + (row.sum?.visits ?? 0) +
                    "** visits / " + (row.count ?? 0) + " page views";
                })
                .join("\n");
            };

            const title = "[Analytics] " + day + " JST";
            const body = [
              "# ASS MAGIC Daily Analytics",
              "",
              "対象日（JST）: **" + day + "**",
              "",
              "## Totals",
              "- **" + visits + "** visits",
              "- **" + pageviews + "** page views",
              "",
              "## Engaged time",
              engagement
                ? "- **" + engagement.sessions + "** measured page sessions"
                : "- Measurement pending / unavailable",
              engagement
                ? "- Average: **" + formatDuration(engagement.averageSeconds) + "**"
                : "- Average: —",
              engagement
                ? "- Median: **" + formatDuration(engagement.medianSeconds) + "**"
                : "- Median: —",
              engagement
                ? "- Total visible time: **" + formatDuration(engagement.totalSeconds) + "**"
                : "- Total visible time: —",
              engagement
                ? "- 1 minute or longer: **" + engagement.sessions60 + "** (" +
                    engagement.oneMinuteRate.toFixed(1) + "%)"
                : "- 1 minute or longer: —",
              "- " + engagementNote,
              "",
              "## Top referrers",
              section(account.referrers, "refererHost", "Direct / unknown"),
              "",
              "## Top paths",
              section(account.paths, "requestPath", "Unknown path"),
              "",
              "## Countries",
              section(account.countries, "countryName", "Unknown country"),
              "",
              "## Devices",
              section(account.devices, "deviceType", "Unknown device"),
              "",
              "_Generated automatically from Cloudflare Web Analytics and Workers Analytics Engine. Re-running this workflow updates this issue instead of creating a duplicate._",
            ].join("\n");

            const titleQuery = "repo:" + context.repo.owner + "/" + context.repo.repo +
              " is:issue in:title " + JSON.stringify(title);
            const search = await github.rest.search.issuesAndPullRequests({
              q: titleQuery,
              per_page: 10,
            });
            const existing = search.data.items.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info("Updated issue #" + existing.number + ": " + title);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info("Created issue #" + created.data.number + ": " + title);
            }

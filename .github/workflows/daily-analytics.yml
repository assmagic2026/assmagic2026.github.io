name: Daily ASS MAGIC analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  report:
    name: Collect previous JST day
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare and notify by issue
        uses: actions/github-script@v7
        env:
          CF_ACCOUNT_ID: 642e2e69809bb007672c7614596ba234
          CF_SITE_TAG: 8d9ad917bb03464c989c2f618c2f529c
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        with:
          script: |
            const token = process.env.CF_ANALYTICS_TOKEN;
            if (!token) {
              core.setFailed("CLOUDFLARE_ANALYTICS_TOKEN is not configured.");
              return;
            }

            const jstNow = new Date(
              new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" })
            );
            jstNow.setDate(jstNow.getDate() - 1);
            const day = [
              jstNow.getFullYear(),
              String(jstNow.getMonth() + 1).padStart(2, "0"),
              String(jstNow.getDate()).padStart(2, "0"),
            ].join("-");
            const start = day + "T00:00:00+09:00";
            const end = day + "T23:59:59+09:00";

            const query = [
              "query DailyWebAnalytics(",
              "  $accountTag: string!,",
              "  $siteTag: string!,",
              "  $start: Time!,",
              "  $end: Time!",
              ") {",
              "  viewer {",
              "    accounts(filter: { accountTag: $accountTag }) {",
              "      total: rumPageloadEventsAdaptiveGroups(",
              "        limit: 1",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } }",
              "      referrers: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { refererHost } }",
              "      paths: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { requestPath } }",
              "      countries: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { countryName } }",
              "      devices: rumPageloadEventsAdaptiveGroups(",
              "        limit: 5",
              "        orderBy: [count_DESC]",
              "        filter: { datetime_geq: $start, datetime_leq: $end, siteTag: $siteTag, bot: 0 }",
              "      ) { count sum { visits } dimensions { deviceType } }",
              "    }",
              "  }",
              "}",
            ].join("\n");

            const response = await fetch("https://api.cloudflare.com/client/v4/graphql", {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
              },
              body: JSON.stringify({
                query,
                variables: {
                  accountTag: process.env.CF_ACCOUNT_ID,
                  siteTag: process.env.CF_SITE_TAG,
                  start,
                  end,
                },
              }),
            });
            const payload = await response.json();
            if (!response.ok || payload.errors?.length) {
              throw new Error(
                "Cloudflare Analytics request failed: " + JSON.stringify(payload.errors || payload)
              );
            }

            const account = payload.data?.viewer?.accounts?.[0];
            if (!account) {
              throw new Error("Cloudflare Analytics returned no account data.");
            }

            const total = account.total?.[0] || {};
            const visits = total.sum?.visits ?? 0;
            const pageviews = total.count ?? 0;
            const section = (rows, dimension, emptyLabel) => {
              if (!rows?.length) return "- No data";
              return rows
                .map((row) => {
                  const label = row.dimensions?.[dimension] || emptyLabel;
                  return "- " + label + ": **" + (row.sum?.visits ?? 0) +
                    "** visits / " + (row.count ?? 0) + " page views";
                })
                .join("\n");
            };

            const title = "[Analytics] " + day + " JST";
            const body = [
              "# ASS MAGIC Daily Analytics",
              "",
              "対象日（JST）: **" + day + "**",
              "",
              "## Totals",
              "- **" + visits + "** visits",
              "- **" + pageviews + "** page views",
              "",
              "## Top referrers",
              section(account.referrers, "refererHost", "Direct / unknown"),
              "",
              "## Top paths",
              section(account.paths, "requestPath", "Unknown path"),
              "",
              "## Countries",
              section(account.countries, "countryName", "Unknown country"),
              "",
              "## Devices",
              section(account.devices, "deviceType", "Unknown device"),
              "",
              "_Generated automatically from Cloudflare Web Analytics. Re-running this workflow updates this issue instead of creating a duplicate._",
            ].join("\n");

            const titleQuery = "repo:" + context.repo.owner + "/" + context.repo.repo +
              " is:issue in:title " + JSON.stringify(title);
            const search = await github.rest.search.issuesAndPullRequests({
              q: titleQuery,
              per_page: 10,
            });
            const existing = search.data.items.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info("Updated issue #" + existing.number + ": " + title);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info("Created issue #" + created.data.number + ": " + title);
            }
